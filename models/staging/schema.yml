version: 2

models:
  - name: stg_customers
    description: "Cleaned and renamed customers from raw source"
    columns:
      - name: customer_id
        description: "Primary key for customers"
        tests:
          - unique
          - not_null
      - name: email
        description: "Customer email address"
        tests:
          - unique
          - not_null
      - name: city
        description: "City where customer is located"
        tests:
          - not_null

  - name: stg_orders
    description: "Cleaned orders with normalized status"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: status
        tests:
          - accepted_values:
              values: ['completed', 'returned', 'pending', 'cancelled']

  - name: stg_order_items
    description: "Individual line items per order"
    columns:
      - name: order_item_id
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: quantity
        tests:
          - not_null

  - name: stg_products
    description: "Cleaned product catalog"
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: unit_price
        tests:
          - not_null

  - name: stg_payments
    description: "Payment records linked to orders"
    columns:
      - name: payment_id
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: payment_method
        tests:
          - accepted_values:
              values: ['credit_card', 'debit_card', 'upi', 'cash', 'netbanking']